<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Studio</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">PS</div>
          <div>
            <h1>Photo Studio</h1>
            <p>Local scan cropper</p>
          </div>
        </div>

        <label class="file-drop" for="fileInput">
          <input id="fileInput" type="file" accept="image/*" multiple />
          <span>Select scan images</span>
          <small>Choose one folder batch or hundreds of scans</small>
        </label>

        <section class="panel">
          <h2>Scan Library</h2>
          <div id="scanList" class="scan-list"></div>
        </section>

        <section class="panel">
          <h2>Detection</h2>
          <label>
            Sensitivity
            <input id="thresholdInput" type="range" min="80" max="252" value="240" />
            <span id="thresholdValue">240</span>
          </label>
          <label>
            Minimum photo size
            <input id="areaInput" type="range" min="2" max="80" value="12" />
            <span id="areaValue">1.2%</span>
          </label>
          <label>
            Border padding
            <input id="paddingInput" type="range" min="0" max="60" value="0" />
            <span id="paddingValue">0px</span>
          </label>
          <button id="detectButton" class="primary" disabled>Detect Photos</button>
          <button id="detectAllButton" disabled>Detect All Scans</button>
        </section>

        <section class="panel">
          <h2>Selected Crop</h2>
          <div class="button-grid">
            <button id="addBoxButton" disabled>Add Crop</button>
            <button id="deleteBoxButton" disabled>Delete</button>
            <button id="rotateLeftButton" disabled>Rotate Left</button>
            <button id="rotateRightButton" disabled>Rotate Right</button>
          </div>
          <label class="check"><input id="autoOrientationInput" type="checkbox" checked /> Auto orientation</label>
          <button id="cropButton" class="primary" disabled>Generate Results</button>
          <button id="exportAllButton" disabled>Export All Reviewed</button>
        </section>

        <section class="panel muted-panel">
          <h2>Pipeline</h2>
          <label class="check"><input type="checkbox" checked disabled /> Crop detection</label>
          <label class="check"><input type="checkbox" checked disabled /> Auto orientation</label>
          <label class="check"><input type="checkbox" checked disabled /> Face grouping</label>
          <label class="check"><input type="checkbox" disabled /> Upscale</label>
        </section>

        <section class="panel">
          <h2>Face Grouping</h2>
          <label>
            Identity threshold
            <input id="faceThresholdInput" type="range" min="10" max="80" value="35" />
            <span id="faceThresholdValue">0.35</span>
          </label>
          <label>
            Face margin
            <input id="faceMarginInput" type="range" min="0" max="80" value="35" />
            <span id="faceMarginValue">0.35</span>
          </label>
          <button id="groupFacesButton" class="primary" disabled>Group Faces</button>
        </section>

        <section class="panel">
          <h2>Save</h2>
          <label>
            Destination folder
            <div class="input-row">
              <input id="saveDestInput" class="text-input" type="text" placeholder="/Users/you/Desktop/PhotoStudio" />
              <button id="pickFolderButton" type="button">Choose…</button>
            </div>
            <small class="hint">Server will create a new export folder inside this path.</small>
          </label>
          <label>
            Top persons (folders)
            <input id="topKInput" type="range" min="1" max="50" value="10" />
            <span id="topKValue">10</span>
          </label>
          <label>
            Min photos per person
            <input id="minPhotosInput" type="range" min="1" max="20" value="2" />
            <span id="minPhotosValue">2</span>
          </label>
          <div class="button-grid">
            <button id="saveAllButton" disabled>Save All Crops</button>
            <button id="saveFacesButton" disabled>Save Face Folders</button>
          </div>
        </section>
      </aside>

      <main class="workspace">
        <header class="toolbar">
          <div>
            <strong id="scanTitle">No scan selected</strong>
            <span id="statusText">Choose an image to begin.</span>
          </div>
          <div class="toolbar-actions">
            <button id="zoomOutButton" disabled>-</button>
            <span id="zoomLabel">100%</span>
            <button id="zoomInButton" disabled>+</button>
          </div>
        </header>

        <div class="main-split">
          <section class="editor">
            <div id="canvasWrap" class="canvas-wrap empty">
              <img id="scanImage" alt="" />
              <svg id="overlay"></svg>
              <div class="empty-state">Select a scan to preview detected crops.</div>
            </div>
          </section>

          <aside class="results-panel current-panel">
            <div class="current-panel-head">
              <h2>Current Scan</h2>
              <span id="exportPath"></span>
            </div>
            <div id="resultsGridCurrent" class="results-grid"></div>
          </aside>
        </div>

        <section class="results">
          <div class="results-panels">
            <section class="results-panel">
              <h2>All Crops</h2>
              <div id="resultsGridAll" class="results-grid"></div>
            </section>

            <section class="results-panel">
              <div id="faceGroups" class="face-groups"></div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
